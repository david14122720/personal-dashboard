name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: backend
    # DB-gated backend tests self-skip without DATABASE_URL; this service plus
    # the migration step below makes them actually execute in CI.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: personal_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/personal_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Service containers cannot mount backend/migrations as initdb scripts
      # (docker-compose does), so apply them with autocommit psql, matching the
      # out-of-band convention documented in the migration files.
      - name: Apply migrations
        run: |
          for migration in migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: cargo test --offline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      # Smoke specs skip cleanly without E2E_SMOKE_LIVE; this step validates
      # spec discovery and loading on every push. The live run happens
      # against a deployed backend (see frontend/playwright.config.ts).
      - run: pnpm exec playwright test --list
